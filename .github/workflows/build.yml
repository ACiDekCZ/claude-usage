name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build the app
        run: |
          xcodebuild -project ClaudeUsage.xcodeproj -scheme ClaudeUsage \
            -configuration Release -derivedDataPath build \
            CODE_SIGN_IDENTITY=- build

      - name: Check the clu CLI compiles
        run: python3 -m py_compile cli/clu
